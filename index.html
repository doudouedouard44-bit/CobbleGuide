#q{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;border:0;background:var(--chip);color:var(--tx);padding:6px 11px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px}
.count{color:var(--mut);font-size:13px;margin:4px 2px 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;width:100%;border:0;background:none;color:inherit;text-align:left;font:inherit}
.nm{font-weight:700;font-size:17px}
.dex{color:var(--mut);font-size:12px}
.tp{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);margin-right:4px}
.body{display:none;padding:2px 14px 14px;border-top:1px solid var(--bd)}
.card.open .body{display:block}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 6px}
.sp{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sp b{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.b{font-size:12.5px;padding:3px 9px;border-radius:8px;background:var(--chip)}
.b.tag{border:1px dashed var(--mut);background:none}
.b.cond{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.b small{color:var(--mut)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--bg);border-radius:10px;padding:9px;font-size:13px;border:1px solid var(--bd)}
.slot em{display:block;font-style:normal;color:var(--mut);font-size:11px;margin-bottom:2px}
.note{color:var(--mut);font-size:12.5px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
@media(max-width:480px){.slots{grid-template-columns:1fr}}
.biorow{margin-bottom:2px}
#bio{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.b.no{background:#d9363e26}
.b.warn{background:#f5a62333;border:1px solid #f5a623}
</style>
</head>

"minecraft:lush_caves":"Grottes luxuriantes","minecraft:mushroom_fields":"Champs de champignons",
"biomesoplenty:erupting_inferno":"Enfer en éruption","biomesoplenty:dead_forest":"Forêt morte","biomesoplenty:old_growth_dead_forest":"Vieille forêt morte","biomesoplenty:lavender_field":"Champ de lavande","biomesoplenty:ominous_woods":"Bois sinistres","biomesoplenty:auroral_garden":"Jardin aurorale","biomesoplenty:mystic_grove":"Bosquet mystique","biomesoplenty:cold_desert":"Désert froid","biomesoplenty:dryland":"Terres arides","biomesoplenty:lush_desert":"Désert luxuriant","biomesoplenty:lush_savanna":"Savane luxuriante","biomesoplenty:volcano":"Volcan","biomesoplenty:volcanic_plains":"Plaines volcaniques","biomesoplenty:origin_valley":"Vallée d’origine","biomesoplenty:wintry_origin_valley":"Vallée d’origine hivernale","biomesoplenty:redwood_forest":"Forêt de séquoias","biomesoplenty:maple_woods":"Bois d’érables","biomesoplenty:snowy_maple_woods":"Bois d’érables enneigés","biomesoplenty:aspen_glade":"Clairière de trembles","biomesoplenty:jacaranda_glade":"Clairière de jacarandas",
"terralith:volcanic_crater":"Cratère volcanique","terralith:volcanic_peaks":"Pics volcaniques","terralith:hot_shrubland":"Garrigue chaude","terralith:emerald_peaks":"Pics d’émeraude","terralith:haze_mountains":"Montagnes brumeuses","terralith:sakura_grove":"Bosquet de sakuras","terralith:alpine_highlands":"Hautes terres alpines","terralith:highlands":"Hautes terres","terralith:frozen_cliffs":"Falaises gelées","terralith:glacial_chasm":"Gouffre glaciaire","terralith:ancient_sands":"Sables antiques","terralith:ashen_savanna":"Savane cendrée","terralith:desert_canyon":"Canyon désertique","terralith:cloud_forest":"Forêt de nuages","terralith:blooming_valley":"Vallée fleurie","terralith:mirage_isles":"Îles mirage","terralith:moonlight_grove":"Bosquet au clair de lune","terralith:moonlight_valley":"Vallée au clair de lune","terralith:alpine_grove":"Bosquet alpin","terralith:snowy_badlands":"Badlands enneigées","terralith:wintry_forest":"Forêt hivernale","terralith:amethyst_canyon":"Canyon d’améthyste","terralith:amethyst_rainforest":"Forêt tropicale d’améthyste","terralith:alpha_islands":"Îles alpha"};
const TYPO={"#cobblemon:is_foral":"#cobblemon:is_floral","terralith:alpine_highland":"terralith:alpine_highlands"};
const POS_FR={u:"En surface de l’eau",g:"Sur terre",s:"Sous l’eau",f:"À la pêche"};
const COND_FR={sky:"Ciel visible",rain:"Il pleut",village:"Dans un village",thunder:"Orage",night:"De nuit",nothunder:"Pas d’orage"};
const MODS={biomesoplenty:"Biomes O’ Plenty",terralith:"Terralith",minecraft:"Minecraft",aether:"Aether"};
const BUCKET_FR={"ultra-rare":"Ultra-rare",common:"Commun",uncommon:"Peu commun"};

/* ====== OUTILS ====== */
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const human=s=>s.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
function bioLabel(b){
  const [m,id]=b.replace("#","").split(":");
  const mod=b[0]==="#"?undefined:(MODS[m]||m);
  if(TYPO[b])return{t:id,tag:b[0]==="#",mod,warn:"Faute de frappe dans le fichier : devrait être "+TYPO[b]+". Ne correspondra à aucun biome en jeu."};
  return{t:BIO_FR[b]||human(id),tag:b[0]==="#",mod};
}
function condLabel(c){return COND_FR[c]||(c.startsWith("struct:")?"Structure : "+c.slice(7):c.startsWith("base:")?"Bloc au sol : "+c.slice(5):c.startsWith("near:")?"À proximité : "+c.slice(5):c)}
function searchText(p){
  return norm([p.n,p.en||"",p.id,...p.t,...p.t.map(t=>TYPE_FR[t]),...p.sp.flatMap(s=>[...s.bio.map(b=>{const l=bioLabel(b);return l.t+" "+(l.mod||"")}),...s.c.map(condLabel),POS_FR[s.pos]])].join(" "));
}

/* ====== RENDU ====== */
const slot=(h,name,sub)=>`<div class="slot"><em>${h}</em><b>${name}</b><br><small>${sub}</small></div>`;
function snack(p){
  const a=ATK_BERRY[p.atk];
  const rar=p.sp[0].b;
  return `<h3>Poké Snack conseillé</h3><div class="slots">
  ${slot("1 · Rareté","Pomme dorée","monte le palier de rareté")}
  ${slot("2 · Type",p.t.map(t=>`Baie ${TYPE_BERRY[t]} <small>(${TYPE_FR[t]})</small>`).join(" ou "),"×10 de chance d’attirer ce type")}
  ${slot("3 · Stat forte",a.n.map(x=>"Baie "+x).join(" ou "),a.d)}</div>
  <div class="note">${rar?"Ce Pokémon est de rareté « "+BUCKET_FR[rar].toLowerCase()+" » : la pomme dorée n’est pas utile, garde plutôt les baies de type. ":""}Plus fort : la <b>pomme dorée enchantée</b> (+10 paliers de rareté, ×10 shiny). Le snack ne remplace pas les conditions de spawn. Vérifie les effets exacts en jeu avec Shift + clic sur la baie.</div>`;
}
function spawn(s,i,n){
  const bio=s.bio.map(b=>{const l=bioLabel(b);return `<span class="b ${l.warn?"warn":l.tag?"tag":""}" ${l.warn?`title="${esc(l.warn)}"`:""}>${l.warn?"⚠ ":""}${esc(l.t)}${l.mod?` <small>${esc(l.mod)}</small>`:""}</span>`}).join("");
  const cond=[POS_FR[s.pos],...s.c.map(condLabel)].map(c=>`<span class="b cond">${esc(c)}</span>`).join("");
  const warn=s.bio.find(b=>TYPO[b]);
  return `<div class="sp"><b>${s.lbl?esc(s.lbl)+" · ":n>1?"Spawn "+(i+1)+" · ":""}Niveau ${esc(s.lvl)} · Poids ${s.w}${s.b?" · "+BUCKET_FR[s.b]:""}</b>
  <div class="row">${cond}</div>
  ${bio?`<div class="row">${bio}</div>`:`<div class="note">Aucun biome particulier requis.</div>`}
  ${s.no?`<div class="row">${s.no.map(b=>`<span class="b no">Exclu : ${esc(bioLabel(b).t)}</span>`).join("")}</div>`:""}
  ${(s.note||[]).map(x=>`<div class="note">${esc(x)}</div>`).join("")}
  ${warn?`<div class="note">⚠ ${esc(bioLabel(warn).warn)}</div>`:""}</div>`;
}
function card(p){
  const bk=BUCKET_FR[p.sp[0].b||"ultra-rare"];
  const wsum=bioF?" · Poids "+p.sp.filter(s=>s.bio.includes(bioF)).reduce((a,s)=>a+s.w,0).toFixed(2).replace(/\.?0+$/,""):"";
  return `<div class="card" data-id="${p.id}">
  <button class="head">
  <div><div class="nm">${p.n}</div><div class="dex">N° ${String(p.id).padStart(4,"0")} · ${bk}${wsum}</div>
  <div>${p.t.map(t=>`<span class="tp">${TYPE_FR[t]}</span>`).join("")}</div></div></button>
  <div class="body"><h3>Conditions de spawn</h3>${p.sp.map((s,i)=>spawn(s,i,p.sp.length)).join("")}${snack(p)}</div></div>`;
}

let typeF=null,bioF="";
const $=id=>document.getElementById(id);
function render(){
  const q=norm($("q").value.trim());
  const res=DATA.filter(p=>(!typeF||p.t.includes(typeF))&&(!bioF||p.sp.some(s=>s.bio.includes(bioF)))&&(!q||searchText(p).includes(q))).sort((a,b)=>bioF?Math.max(...b.sp.filter(s=>s.bio.includes(bioF)).map(s=>s.w))-Math.max(...a.sp.filter(s=>s.bio.includes(bioF)).map(s=>s.w)):a.id-b.id);
  $("count").innerHTML=res.length+" Pokémon sur "+DATA.length+(bioF?`<br><small>Seuls les biomes cités tels quels dans les fichiers sont trouvés : choisis aussi la catégorie (#) qui contient ton biome. Tri par poids de spawn.</small>`:"");
  $("list").innerHTML=res.length?res.map(card).join(""):`<div class="empty">Aucun résultat.</div>`;
  if(res.length===1)$("list").firstElementChild.classList.add("open");
}
function chips(){
  const ts=[...new Set(DATA.flatMap(p=>p.t))];
  $("chips").innerHTML=`<button class="chip on" data-t="">Tous</button>`+ts.map(t=>`<button class="chip" data-t="${t}">${TYPE_FR[t]}</button>`).join("");
}
function biomes(){
  const all=[...new Set(DATA.flatMap(p=>p.sp.flatMap(s=>s.bio)))];
  const lab=b=>{const l=bioLabel(b);return l.t+(l.mod?" · "+l.mod:"")+(l.warn?" ⚠":"")};
  const grp=(t,a)=>`<optgroup label="${t}">`+a.sort((x,y)=>lab(x).localeCompare(lab(y),"fr")).map(b=>`<option value="${esc(b)}">${esc(lab(b))}</option>`).join("")+"</optgroup>";
  $("bio").innerHTML=`<option value="">Tous les biomes</option>`+grp("Catégories de biomes",all.filter(b=>b[0]==="#"))+grp("Biomes précis",all.filter(b=>b[0]!=="#"));
}
$("bio").addEventListener("change",e=>{bioF=e.target.value;render()});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  typeF=b.dataset.t||null;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
  render();
});
$("list").addEventListener("click",e=>{const h=e.target.closest(".head");if(h)h.parentElement.classList.toggle("open")});
$("q").addEventListener("input",render);
chips();biomes();render();
</script>
</body>
</html>
